[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expolicy"
version = "0.1.0"
description = "ExPolicy: Learning What to Experience and How to Assimilate It for Self-Evolving Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ExPolicy authors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "omegaconf>=2.3,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "rank-bm25>=0.2.2,<1",
  "scikit-learn>=1.4,<2",
  "networkx>=3.2,<4",
  "orjson>=3.9,<4",
  "tenacity>=8.2,<10",
  "httpx>=0.27,<1",
  "jsonlines>=4.0,<5",
  "filelock>=3.13,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
train = [
  "torch>=2.4",
  "transformers>=4.44",
  "accelerate>=0.34",
  "peft>=0.12",
  "trl>=0.9",
  "datasets>=2.20",
]
serve = [
  "vllm>=0.6",
]
index = [
  "faiss-cpu>=1.8",
]

[project.scripts]
expolicy = "expolicy.cli.main:app"

[tool.setuptools.packages.find]
include = ["expolicy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "gpu: tests that require a CUDA GPU and a local causal LM",
  "slow: longer integration or end-to-end runs",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["expolicy", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.mypy]
python_version = "3.11"
packages = ["expolicy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["expolicy"]
branch = true
omit = ["expolicy/cli/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
